name: Veille quotidienne (module optionnel)

# Ce workflow ne sert que si le module de veille (npm run news) a été demandé et configuré -- voir
# AGENTS.md. Le déclencheur "schedule" est volontairement désactivé ici : ce dépôt est un modèle, pas
# un serveur réel, et un cron actif par défaut enverrait des exécutions (et des e-mails d'échec) pour
# rien. Une fois le module réellement configuré pour un utilisateur (secrets + config/news_sources.yml
# remplis), l'agent doit décommenter le bloc "schedule" ci-dessous.
on:
  # schedule:
  #   # Deux horaires UTC pour couvrir les deux cas d'heure d'été/hiver -- le script (NEWS_HOUR /
  #   # NEWS_TIMEZONE) ne laisse agir que le run qui tombe réellement sur l'heure cible.
  #   - cron: "0 10 * * *"
  #   - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer l'exécution même hors fenêtre horaire cible"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Veille
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SERVER_NAME: ${{ vars.SERVER_NAME }}
          NEWS_TOPICS: ${{ vars.NEWS_TOPICS }}
          NEWS_CHANNEL_KEY: ${{ vars.NEWS_CHANNEL_KEY }}
          NEWS_ROLE_KEY: ${{ vars.NEWS_ROLE_KEY }}
          NEWS_HOUR: ${{ vars.NEWS_HOUR }}
          NEWS_TIMEZONE: ${{ vars.NEWS_TIMEZONE }}
          FORCE_RUN: ${{ inputs.force }}
        run: npm run news

      - name: Commit du ledger de dédoublonnage
        run: |
          git config user.name "discord-server-agent-bot"
          git config user.email "actions@github.com"
          git add reports/news-seen.json
          git diff --cached --quiet || git commit -m "chore: mise à jour du ledger de veille"
          git push
